name: Deploy Strato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: strato-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Productie-check (robots, sitemap)
        run: node scripts/verify-production-ready.mjs
      - name: Tests (zonder visueel)
        run: npm test
        env:
          STRICT_EXTERNAL: '1'
          SKIP_VISUAL: '1'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Productiebestanden bundelen
        run: node scripts/stage-strato-deploy.mjs
      - name: Upload naar Strato (SSH/SCP, poort 22)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STRATO_SFTP_SERVER }}
          username: ${{ secrets.STRATO_SFTP_USERNAME }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          port: 22
          source: '.deploy-staging/'
          target: ${{ secrets.STRATO_SFTP_REMOTE_DIR }}
          strip_components: 1
          overwrite: true