name: Deploy Strato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: strato-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Productie-check (robots, sitemap)
        run: node scripts/verify-production-ready.mjs
      - name: Tests (zonder visueel)
        run: npm test
        env:
          STRICT_EXTERNAL: '1'
          SKIP_VISUAL: '1'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Productiebestanden bundelen
        run: node scripts/stage-strato-deploy.mjs
      - name: Controle deploy-doelmap
        env:
          STRATO_SFTP_REMOTE_DIR: ${{ secrets.STRATO_SFTP_REMOTE_DIR }}
        run: node scripts/validate-strato-remote-dir.mjs
      - name: lftp (SFTP-mirror; Strato heeft geen SCP)
        env:
          STRATO_SFTP_SERVER: ${{ secrets.STRATO_SFTP_SERVER }}
          STRATO_SFTP_USERNAME: ${{ secrets.STRATO_SFTP_USERNAME }}
          STRATO_SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          STRATO_SFTP_REMOTE_DIR: ${{ secrets.STRATO_SFTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          bash scripts/deploy-strato-lftp.sh